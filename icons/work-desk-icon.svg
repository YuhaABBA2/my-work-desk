<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="우리집 데스크">
  <rect width="512" height="512" fill="#eef2e6"/>
  <ellipse cx="256" cy="460" rx="230" ry="41" fill="#cee8d2"/>
  <!-- Trunk -->
  <rect x="228.16" y="317.44" width="55.68" height="122.88" rx="20" ry="20" fill="#8b6b3f"/>
  <rect x="256.16" y="317.44" width="27.68" height="122.88" rx="17" ry="17" fill="#6e522e"/>
  <!-- Canopy: three overlapping circles -->
  <circle cx="181.6"  cy="235.52" r="86.5"  fill="#80c394"/>
  <circle cx="329.6"  cy="235.52" r="86.5"  fill="#3a9457"/>
  <circle cx="256"    cy="174.08" r="90"    fill="#226937"/>
  <!-- Family figures on the grass: adult, child, adult -->
  <g fill="#ffffff">
    <!-- Left adult -->
    <circle cx="174.08" cy="431.5" r="15.7"/>
    <rect x="153.3" y="453" width="41.6" height="43" rx="14.5"/>
    <!-- Center child (smaller, slightly lower) -->
    <circle cx="256"    cy="443"   r="11.2"/>
    <rect x="240" y="459" width="32" height="30" rx="11"/>
    <!-- Right adult -->
    <circle cx="337.92" cy="431.5" r="15.7"/>
    <rect x="317.1" y="453" width="41.6" height="43" rx="14.5"/>
  </g>
</svg>
