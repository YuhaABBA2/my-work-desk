<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#123B72" />
  <title>나의 업무판</title>
  <style>
    :root{--ink:#14243c;--muted:#68758a;--navy:#123b72;--blue:#2165ba;--sky:#eaf3ff;--line:#dbe3ee;--paper:#fff;--bg:#f5f7fa;--red:#c63b4b;--amber:#c57910;--green:#23775c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1220px;margin:auto;padding:28px 22px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:13px;font-weight:800;letter-spacing:.08em}.top h1{margin:5px 0 0;font-size:28px;letter-spacing:-.05em}.date{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:1.42fr .92fr;gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 5px 18px #15233a08}.wide{grid-column:1/-1}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:14px}.card h2{font-size:18px;letter-spacing:-.04em;margin:0}.hint{font-size:13px;color:var(--muted)}.summary{display:flex;gap:10px}.stat{min-width:84px;padding:11px;border-radius:12px;background:var(--sky)}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}.tasks{display:grid;gap:8px}.task{display:flex;align-items:center;gap:11px;padding:12px 10px;border:1px solid var(--line);border-radius:11px}.task.done{opacity:.46}.task.done .task-title{text-decoration:line-through}.check{width:20px;height:20px;accent-color:var(--navy)}.task-main{min-width:0;flex:1}.task-title{font-weight:700;letter-spacing:-.02em}.task-meta{font-size:12px;color:var(--muted);margin-top:3px}.badge{font-size:12px;font-weight:800;padding:4px 7px;border-radius:8px;white-space:nowrap}.high{background:#fff0f1;color:var(--red)}.middle{background:#fff6e9;color:var(--amber)}.low{background:#edf8f4;color:var(--green)}.delete{border:0;color:#98a3b3;background:transparent;font-size:18px}.form{display:grid;gap:10px}.form input,.form select,.form textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}.form textarea{min-height:63px;resize:vertical}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.primary{background:var(--navy);border:0;color:#fff;border-radius:10px;padding:11px;font-weight:800}.project-list{display:grid;gap:9px}.project{padding:12px;border:1px solid var(--line);border-radius:11px}.project-line{display:flex;justify-content:space-between;gap:8px;font-weight:750}.bar{height:7px;background:#edf0f5;border-radius:9px;overflow:hidden;margin-top:9px}.bar i{height:100%;display:block;background:var(--blue);border-radius:9px}.calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.month-nav{display:flex;gap:6px}.month-nav button{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week span{text-align:center;font-size:12px;color:var(--muted);padding:5px}.day{min-height:66px;padding:7px;border-radius:9px;background:#f7f9fc;border:1px solid transparent;font-size:13px}.day.today{border-color:var(--blue);background:#eef6ff}.day.other{opacity:.35}.day b{font-size:12px}.dot{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:5px;padding:2px 4px;background:#dcecff;color:#154b91;border-radius:4px;font-size:10px}.empty{padding:20px 0;text-align:center;color:var(--muted);font-size:14px}.footnote{margin-top:16px;font-size:12px;color:var(--muted)}@media(max-width:760px){.app{padding:18px 14px}.top{align-items:flex-start;gap:10px}.top h1{font-size:24px}.date{text-align:right;line-height:1.5}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.card{padding:16px}.summary{gap:6px}.stat{min-width:0;flex:1}.day{min-height:56px;padding:5px}.week span{font-size:11px}.dot{font-size:9px}.form-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div><div class="eyebrow">PERSONAL WORK DESK</div><h1>나의 업무판</h1></div><div class="date" id="todayLabel"></div></header>
    <section class="grid">
      <article class="card">
        <div class="card-head"><div><h2>오늘 해야 할 일</h2><span class="hint">중요한 일부터 한 칸씩 비우십시오.</span></div><div class="summary"><div class="stat"><b id="openCount">0</b><span>남은 업무</span></div><div class="stat"><b id="doneCount">0</b><span>완료</span></div></div></div>
        <div id="todayTasks" class="tasks"></div>
      </article>
      <article class="card"><div class="card-head"><h2>업무 · 일정 추가</h2></div>
        <form id="addForm" class="form"><input id="title" required placeholder="할 일 또는 일정 제목" /><div class="form-row"><input id="date" type="date" required /><select id="priority"><option value="high">중요</option><option value="middle" selected>보통</option><option value="low">여유</option></select></div><div class="form-row"><input id="project" list="projects" placeholder="프로젝트 / 업무분류" /><input id="time" type="time" /></div><textarea id="note" placeholder="메모 (선택)"></textarea><button class="primary">추가하기</button></form><datalist id="projects"><option value="회사 업무"><option value="개인 일정"><option value="투자 · 자산"><option value="Work Station"></datalist>
      </article>
      <article class="card"><div class="card-head"><h2>프로젝트 진행</h2><span class="hint">미완료 업무 기준</span></div><div id="projectsView" class="project-list"></div></article>
      <article class="card"><div class="card-head"><h2>이번 주 마감</h2><span class="hint">7일 안에 처리할 일</span></div><div id="weekTasks" class="tasks"></div></article>
      <article class="card wide"><div class="calendar-header"><h2 id="monthLabel"></h2><div class="month-nav"><button id="prev">‹</button><button id="next">›</button></div></div><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar" class="days"></div><div class="footnote">이 기기와 브라우저에 기록됩니다. 나중에 계정 연동을 붙이면 휴대폰·PC 간에도 같은 일정으로 사용할 수 있습니다.</div></article>
    </section>
  </main>
<script>
const key='personal-work-desk-v1', $=s=>document.querySelector(s); const today=new Date(); today.setHours(0,0,0,0); let view=new Date(today.getFullYear(),today.getMonth(),1);
const seed=[{id:1,title:'이번 주 업무 우선순위 정리',date:iso(today),priority:'high',project:'회사 업무',time:'09:30',done:false},{id:2,title:'투자 브리핑 확인',date:iso(add(today,1)),priority:'middle',project:'투자 · 자산',time:'08:30',done:false},{id:3,title:'개인 업무판 첫 기록 시작',date:iso(today),priority:'low',project:'개인 일정',time:'',done:false}];
let tasks=JSON.parse(localStorage.getItem(key)||'null')||seed; function iso(d){return d.toISOString().slice(0,10)} function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x} function save(){localStorage.setItem(key,JSON.stringify(tasks))} function escape(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function priority(p){return p==='high'?'중요':p==='middle'?'보통':'여유'} function taskHTML(t){return `<div class="task ${t.done?'done':''}"><input class="check" type="checkbox" ${t.done?'checked':''} onchange="toggle(${t.id})"/><div class="task-main"><div class="task-title">${escape(t.title)}</div><div class="task-meta">${t.time?t.time+' · ':''}${escape(t.project||'미분류')}${t.note?' · '+escape(t.note):''}</div></div><span class="badge ${t.priority}">${priority(t.priority)}</span><button class="delete" aria-label="삭제" onclick="removeTask(${t.id})">×</button></div>`}
function render(){const todayStr=iso(today), ongoing=tasks.filter(t=>!t.done), done=tasks.filter(t=>t.done); $('#openCount').textContent=ongoing.length;$('#doneCount').textContent=done.length; $('#todayTasks').innerHTML=tasks.filter(t=>t.date===todayStr).sort(sorter).map(taskHTML).join('')||'<div class="empty">오늘 등록된 업무가 없습니다.</div>';
const until=iso(add(today,7));$('#weekTasks').innerHTML=ongoing.filter(t=>t.date>=todayStr&&t.date<=until).sort(sorter).map(taskHTML).join('')||'<div class="empty">이번 주 마감 업무가 없습니다.</div>';
const groups={};ongoing.forEach(t=>{let p=t.project||'미분류';(groups[p]??=[]).push(t)});$('#projectsView').innerHTML=Object.entries(groups).map(([p,items])=>{let all=tasks.filter(t=>(t.project||'미분류')===p),pct=Math.round((all.length-items.length)/all.length*100);return `<div class="project"><div class="project-line"><span>${escape(p)}</span><span class="hint">${items.length}건 남음</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`}).join('')||'<div class="empty">프로젝트별 업무를 등록해 보세요.</div>'; calendar();}
function sorter(a,b){return (a.date+a.time).localeCompare(b.date+b.time)}function toggle(id){tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);save();render()}function removeTask(id){tasks=tasks.filter(t=>t.id!==id);save();render()} window.toggle=toggle;window.removeTask=removeTask;
function calendar(){const y=view.getFullYear(),m=view.getMonth(), start=new Date(y,m,1);$('#monthLabel').textContent=`${y}년 ${m+1}월`; let first=start.getDay(), days=new Date(y,m+1,0).getDate(), prev=new Date(y,m,0).getDate(), html='';for(let i=0;i<42;i++){let n,dt,other=false;if(i<first){n=prev-first+i+1;dt=new Date(y,m-1,n);other=true}else if(i>=first+days){n=i-first-days+1;dt=new Date(y,m+1,n);other=true}else{n=i-first+1;dt=new Date(y,m,n)}let list=tasks.filter(t=>t.date===iso(dt)).slice(0,2);html+=`<div class="day ${other?'other':''} ${iso(dt)===iso(today)?'today':''}"><b>${n}</b>${list.map(t=>`<span class="dot">${escape(t.title)}</span>`).join('')}</div>`}$('#calendar').innerHTML=html}
$('#addForm').addEventListener('submit',e=>{e.preventDefault();tasks.push({id:Date.now(),title:$('#title').value.trim(),date:$('#date').value,priority:$('#priority').value,project:$('#project').value.trim(),time:$('#time').value,note:$('#note').value.trim(),done:false});save();e.target.reset();$('#date').value=iso(today);render()});$('#prev').onclick=()=>{view.setMonth(view.getMonth()-1);calendar()};$('#next').onclick=()=>{view.setMonth(view.getMonth()+1);calendar()};$('#date').value=iso(today);$('#todayLabel').textContent=today.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});render();
</script></body></html>
