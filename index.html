<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123B72"><title>나의 업무판</title>
  <style>
  :root{--ink:#14243c;--muted:#68758a;--navy:#123b72;--blue:#2165ba;--sky:#eaf3ff;--line:#dbe3ee;--paper:#fff;--bg:#f5f7fa;--red:#c63b4b;--amber:#c57910;--green:#23775c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1220px;margin:auto;padding:28px 22px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:13px;font-weight:800;letter-spacing:.08em}.top h1{margin:5px 0 0;font-size:28px;letter-spacing:-.05em}.topRight{display:flex;gap:10px;align-items:center}.date{color:var(--muted);font-size:14px}.user{font-size:13px;color:var(--muted)}.logout{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.42fr .92fr;gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 5px 18px #15233a08}.wide{grid-column:1/-1}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:14px}.card h2{font-size:18px;letter-spacing:-.04em;margin:0}.hint{font-size:13px;color:var(--muted)}.summary{display:flex;gap:10px}.stat{min-width:84px;padding:11px;border-radius:12px;background:var(--sky)}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}.tasks{display:grid;gap:8px}.task{display:flex;align-items:center;gap:11px;padding:12px 10px;border:1px solid var(--line);border-radius:11px}.task.done{opacity:.46}.task.done .task-title{text-decoration:line-through}.check{width:20px;height:20px;accent-color:var(--navy)}.task-main{min-width:0;flex:1}.task-title{font-weight:700;letter-spacing:-.02em}.task-meta{font-size:12px;color:var(--muted);margin-top:3px}.badge{font-size:12px;font-weight:800;padding:4px 7px;border-radius:8px;white-space:nowrap}.high{background:#fff0f1;color:var(--red)}.middle{background:#fff6e9;color:var(--amber)}.low{background:#edf8f4;color:var(--green)}.delete{border:0;color:#98a3b3;background:transparent;font-size:18px}.form{display:grid;gap:10px}.form input,.form select,.form textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}.form textarea{min-height:63px;resize:vertical}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.primary{background:var(--navy);border:0;color:#fff;border-radius:10px;padding:11px;font-weight:800}.project-list{display:grid;gap:9px}.project{padding:12px;border:1px solid var(--line);border-radius:11px}.project-line{display:flex;justify-content:space-between;gap:8px;font-weight:750}.bar{height:7px;background:#edf0f5;border-radius:9px;overflow:hidden;margin-top:9px}.bar i{height:100%;display:block;background:var(--blue);border-radius:9px}.calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.month-nav{display:flex;gap:6px}.month-nav button{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week span{text-align:center;font-size:12px;color:var(--muted);padding:5px}.day{min-height:66px;padding:7px;border-radius:9px;background:#f7f9fc;border:1px solid transparent;font-size:13px}.day.today{border-color:var(--blue);background:#eef6ff}.day.other{opacity:.35}.day b{font-size:12px}.dot{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:5px;padding:2px 4px;background:#dcecff;color:#154b91;border-radius:4px;font-size:10px}.empty{padding:20px 0;text-align:center;color:var(--muted);font-size:14px}.footnote{margin-top:16px;font-size:12px;color:var(--muted)}.overlay{position:fixed;inset:0;background:#edf3fc;display:grid;place-items:center;padding:20px;z-index:5}.login{width:min(420px,100%);padding:34px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 22px 55px #15233a1a}.login h1{margin:7px 0 10px;font-size:28px;letter-spacing:-.05em}.login p{line-height:1.65;color:var(--muted);font-size:14px}.google{width:100%;margin-top:16px;padding:13px;border-radius:10px;border:1px solid #ccd7e6;background:#fff;color:var(--ink);font-weight:800}.notice{min-height:18px;margin:12px 0 0;color:var(--red);font-size:13px}@media(max-width:760px){.app{padding:18px 14px}.top{align-items:flex-start;gap:10px}.top h1{font-size:24px}.topRight{align-items:flex-end;flex-direction:column}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.card{padding:16px}.summary{gap:6px}.stat{min-width:0;flex:1}.day{min-height:56px;padding:5px}.week span{font-size:11px}.dot{font-size:9px}.form-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="loginOverlay" class="overlay"><section class="login"><div class="eyebrow">PERSONAL WORK DESK</div><h1>나의 업무판</h1><p>Google 계정으로 로그인하면 일정과 업무가 안전하게 저장되고, 모든 기기에서 이어집니다.</p><button id="googleLogin" class="google">Google로 계속하기</button><div id="notice" class="notice"></div></section></div>
<main id="app" class="app" hidden><header class="top"><div><div class="eyebrow">PERSONAL WORK DESK</div><h1>나의 업무판</h1></div><div class="topRight"><div id="todayLabel" class="date"></div><div><span id="userName" class="user"></span> <button id="logout" class="logout">로그아웃</button></div></div></header><section class="grid">
<article class="card"><div class="card-head"><div><h2>오늘 해야 할 일</h2><span class="hint">중요한 일부터 한 칸씩 비우십시오.</span></div><div class="summary"><div class="stat"><b id="openCount">0</b><span>남은 업무</span></div><div class="stat"><b id="doneCount">0</b><span>완료</span></div></div></div><div id="todayTasks" class="tasks"></div></article>
<article class="card"><div class="card-head"><h2>업무 · 일정 추가</h2></div><form id="addForm" class="form"><input id="title" required maxlength="200" placeholder="할 일 또는 일정 제목"><div class="form-row"><input id="date" type="date" required><select id="priority"><option value="high">중요</option><option value="middle" selected>보통</option><option value="low">여유</option></select></div><div class="form-row"><input id="project" list="projects" maxlength="100" placeholder="프로젝트 / 업무분류"><input id="time" type="time"></div><textarea id="note" maxlength="1000" placeholder="메모 (선택)"></textarea><button class="primary">추가하기</button></form><datalist id="projects"><option value="회사 업무"><option value="개인 일정"><option value="투자 · 자산"><option value="Work Station"></datalist></article>
<article class="card"><div class="card-head"><h2>프로젝트 진행</h2><span class="hint">미완료 업무 기준</span></div><div id="projectsView" class="project-list"></div></article><article class="card"><div class="card-head"><h2>이번 주 마감</h2><span class="hint">7일 안에 처리할 일</span></div><div id="weekTasks" class="tasks"></div></article>
<article class="card wide"><div class="calendar-header"><h2 id="monthLabel"></h2><div class="month-nav"><button id="prev">‹</button><button id="next">›</button></div></div><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar" class="days"></div><div class="footnote">로그인한 계정의 업무만 표시됩니다.</div></article></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl='https://skihcfyndumifhaxamas.supabase.co';
const supabaseKey='sb_publishable_6igMLFNC7cYgN2gCjwUvpg_mYcsFN4B';
const sb=window.supabase.createClient(supabaseUrl,supabaseKey); const $=s=>document.querySelector(s);const today=new Date();today.setHours(0,0,0,0);let view=new Date(today.getFullYear(),today.getMonth(),1),tasks=[],user;
function iso(d){return d.toISOString().slice(0,10)}function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function pri(p){return p==='high'?'중요':p==='middle'?'보통':'여유'}function sort(a,b){return(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))}
async function load(){let{data,error}=await sb.from('work_tasks').select('*').order('task_date').order('task_time');if(error)return alert('업무 목록을 불러오지 못했습니다. Supabase 설정을 확인해 주세요.');tasks=data.map(x=>({id:x.id,title:x.title,date:x.task_date,priority:x.priority,project:x.project,time:x.task_time?.slice(0,5)||'',note:x.note,done:x.done}));render()}
function taskHTML(t){return `<div class="task ${t.done?'done':''}"><input class="check" type="checkbox" ${t.done?'checked':''} onchange="toggle('${t.id}')"><div class="task-main"><div class="task-title">${esc(t.title)}</div><div class="task-meta">${t.time?t.time+' · ':''}${esc(t.project||'미분류')}${t.note?' · '+esc(t.note):''}</div></div><span class="badge ${t.priority}">${pri(t.priority)}</span><button class="delete" aria-label="삭제" onclick="removeTask('${t.id}')">×</button></div>`}
function render(){let td=iso(today),ongoing=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done);$('#openCount').textContent=ongoing.length;$('#doneCount').textContent=done.length;$('#todayTasks').innerHTML=tasks.filter(t=>t.date===td).sort(sort).map(taskHTML).join('')||'<div class="empty">오늘 등록된 업무가 없습니다.</div>';let until=iso(add(today,7));$('#weekTasks').innerHTML=ongoing.filter(t=>t.date>=td&&t.date<=until).sort(sort).map(taskHTML).join('')||'<div class="empty">이번 주 마감 업무가 없습니다.</div>';let groups={};ongoing.forEach(t=>{let p=t.project||'미분류';(groups[p]??=[]).push(t)});$('#projectsView').innerHTML=Object.entries(groups).map(([p,items])=>{let all=tasks.filter(t=>(t.project||'미분류')===p),pct=Math.round((all.length-items.length)/all.length*100);return `<div class="project"><div class="project-line"><span>${esc(p)}</span><span class="hint">${items.length}건 남음</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`}).join('')||'<div class="empty">프로젝트별 업무를 등록해 보세요.</div>';calendar()}
async function toggle(id){let t=tasks.find(x=>x.id===id);let{error}=await sb.from('work_tasks').update({done:!t.done,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert('저장하지 못했습니다.');t.done=!t.done;render()}async function removeTask(id){if(!confirm('이 업무를 삭제할까요?'))return;let{error}=await sb.from('work_tasks').delete().eq('id',id);if(error)return alert('삭제하지 못했습니다.');tasks=tasks.filter(t=>t.id!==id);render()}window.toggle=toggle;window.removeTask=removeTask;
function calendar(){let y=view.getFullYear(),m=view.getMonth(),start=new Date(y,m,1);$('#monthLabel').textContent=`${y}년 ${m+1}월`;let first=start.getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),html='';for(let i=0;i<42;i++){let n,dt,other=false;if(i<first){n=prev-first+i+1;dt=new Date(y,m-1,n);other=true}else if(i>=first+days){n=i-first-days+1;dt=new Date(y,m+1,n);other=true}else{n=i-first+1;dt=new Date(y,m,n)}let list=tasks.filter(t=>t.date===iso(dt)).slice(0,2);html+=`<div class="day ${other?'other':''} ${iso(dt)===iso(today)?'today':''}"><b>${n}</b>${list.map(t=>`<span class="dot">${esc(t.title)}</span>`).join('')}</div>`}$('#calendar').innerHTML=html}
$('#addForm').addEventListener('submit',async e=>{e.preventDefault();let record={user_id:user.id,title:$('#title').value.trim(),task_date:$('#date').value,priority:$('#priority').value,project:$('#project').value.trim()||null,task_time:$('#time').value||null,note:$('#note').value.trim()||null};let{data,error}=await sb.from('work_tasks').insert(record).select().single();if(error)return alert('저장하지 못했습니다. Supabase 테이블 설정을 확인해 주세요.');tasks.push({id:data.id,title:data.title,date:data.task_date,priority:data.priority,project:data.project,time:data.task_time?.slice(0,5)||'',note:data.note,done:data.done});e.target.reset();$('#date').value=iso(today);render()});
$('#prev').onclick=()=>{view.setMonth(view.getMonth()-1);calendar()};$('#next').onclick=()=>{view.setMonth(view.getMonth()+1);calendar()};$('#googleLogin').onclick=async()=>{let{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(error)$('#notice').textContent='로그인을 시작하지 못했습니다. Google 로그인이 활성화됐는지 확인해 주세요.'};$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function start(){let{data:{session}}=await sb.auth.getSession();if(!session)return;user=session.user;$('#userName').textContent=user.email||'로그인됨';$('#todayLabel').textContent=today.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('#date').value=iso(today);$('#loginOverlay').hidden=true;$('#app').hidden=false;await load()}sb.auth.onAuthStateChange((_e,s)=>{if(s&&!user)start()});start();
</script></body></html>
